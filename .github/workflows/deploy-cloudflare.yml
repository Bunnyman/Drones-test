name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - claude/drone-map-time-scrubber-f44Pd
    paths:
      - drones_map.html
      - .github/workflows/deploy-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp drones_map.html _site/index.html

      - name: Pre-flight — secrets present?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tok_len=${#CLOUDFLARE_API_TOKEN}
          acct_len=${#CLOUDFLARE_ACCOUNT_ID}
          echo "CLOUDFLARE_API_TOKEN  length: $tok_len"
          echo "CLOUDFLARE_ACCOUNT_ID length: $acct_len"
          missing=0
          if [ "$tok_len" -eq 0 ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing or empty in repo settings"
            missing=1
          fi
          if [ "$acct_len" -eq 0 ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing or empty in repo settings"
            missing=1
          fi
          exit $missing

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: debug
        run: |
          set +e
          echo "::group::Account sanity check (whoami)"
          npx wrangler@latest whoami
          echo "::endgroup::"

          echo "::group::Ensure project exists"
          npx wrangler@latest pages project create drones-timeline \
            --production-branch=main
          create_status=$?
          echo "project-create exited with $create_status (non-zero is OK if it already exists)"
          echo "::endgroup::"

          set -e
          echo "::group::Deploy"
          npx wrangler@latest pages deploy _site \
            --project-name=drones-timeline \
            --branch=main
          echo "::endgroup::"
