grs":"37UCQ9362721350","comment":"\u0437\u0430\u0445\u0456\u0434 \u0434\u0435\u0442\u043e\u043d\u0430\u0442\u043e\u0440\u0430 \u043d\u0430 \u0433\u0430\u0437\u0435\u043b\u044c, \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u043d\u0435\u0432\u0456\u0434\u043e\u043c\u0438\u0439. \u041c03"},{"t":1779199416,"lat":48.814047,"lon":37.852927,"mgrs":"37UDQ1578907419","comment":"\u0443\u0434\u0430\u0440 \u043c\u043e\u043b\u043d\u0456\u0457 \u0420\u0430\u0439-\u041e\u043b\u0435\u043a\u0441\u0430\u043d\u0434\u0440\u0456\u0432\u043a\u0430"},{"t":1779202631,"lat":48.837398,"lon":37.776513,"mgrs":"37UDQ1022110102","comment":"\u041f\u043e\u0434\u0430\u0432\u043b\u0434\u0435\u043d\u043e \u0432 \u0440\u0430\u0439\u043e\u043d\u0456 \u041c\u0438\u043a\u043e\u043b\u0430\u0457\u0432\u043a\u0438 1530 \u041c\u043e\u043b\u043d\u0456\u044f"},{"t":1779203500,"lat":48.965295,"lon":37.81887,"mgrs":"37UDQ1355024270","comment":"\u0443\u0434\u0430\u0440 \u043c\u043e\u043b\u043d\u0456\u0457 \u041b\u0438\u043c\u0430\u043d"},{"t":1779204752,"lat":48.859427,"lon":37.802003,"mgrs":"37UDQ1213012521","comment":"\u043f\u043e\u0434\u0430\u0432\u043b\u0435\u043d\u043e \u0431\u0456\u043b\u044f \u041c\u0438\u043a\u043e\u043b\u0430\u0457\u0432\u043a\u0438"},{"t":1779205587,"lat":48.788249,"lon":37.755257,"mgrs":"37UDQ0857204664","comment":"1505 \u041f\u043e\u0434\u0430\u0432\u043b\u0435\u043d\u043e \u0431\u0456\u043b\u044f \u041d\u0438\u043a\u043e\u043d\u043e\u0440\u0456\u0432\u043a\u0438"},{"t":1779213164,"lat":48.886842,"lon":37.795441,"mgrs":"37UDQ1169715576","comment":"\u043f\u043e\u0434\u0430\u0432\u043b\u0435\u043d\u043e \u0421\u0442\u0430\u0440\u043e\u0434\u0443\u0431\u0456\u0432\u043a\u0430"},{"t":1779213943,"lat":48.849713,"lon":37.756283,"mgrs":"37UDQ0875911495","comment":"\u043f\u043e\u0434\u0430\u0432\u043b\u0435\u043d\u043e \u041c\u0438\u043a\u043e\u043b\u0430\u0457\u0432\u043a\u0430"},{"t":1779214082,"lat":48.864117,"lon":37.958833,"mgrs":"37UDQ2364012873","comment":""},{"t":1779214719,"lat":48.910269,"lon":37.620567,"mgrs":"37UCQ9892518398","comment":"\u043f\u043e\u0434\u0430\u0432\u043b\u0435\u043d\u043e \u0431\u0456\u043b\u044f \u0421\u043b\u043e\u0432'\u044f\u043d\u0441\u044c\u043a\u0430 (\u041a\u0430\u0440\u043f\u0456\u0432\u043a\u0430)"},{"t":1779225628,"lat":49.047793,"lon":37.812414,"mgrs":"37UDQ1322133448","comment":""},{"t":1779226951,"lat":48.696068,"lon":37.649452,"mgrs":"37UDP0061994550","comment":""},{"t":1779228009,"lat":48.927673,"lon":37.576577,"mgrs":"37UCQ9573820392","comment":""}];

const tMin = EVENTS[0].t;
const tMax = EVENTS[EVENTS.length - 1].t;

const map = L.map('map', { preferCanvas: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Fit to all event bounds initially.
const allBounds = L.latLngBounds(EVENTS.map(e => [e.lat, e.lon]));
map.fitBounds(allBounds, { padding: [20, 20] });

const cluster = L.markerClusterGroup({
  maxClusterRadius: 45,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
});
map.addLayer(cluster);

const slider = document.getElementById('slider');
const currentLabel = document.getElementById('current');
const countLabel = document.getElementById('count');
const windowSel = document.getElementById('window');
const speedSel = document.getElementById('speed');
const playBtn = document.getElementById('play');

// Range covers tMin..tMax in 60-second steps.
slider.min = tMin;
slider.max = tMax;
slider.step = 60;
slider.value = tMin;

function fmt(ts) {
  const d = new Date(ts * 1000);
  return d.toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
}

function update() {
  const center = parseInt(slider.value, 10);
  const half = parseInt(windowSel.value, 10) / 2;
  const lo = center - half;
  const hi = center + half;
  const visible = EVENTS.filter(e => e.t >= lo && e.t <= hi);

  // Aggregate by rounded location so co-located events share a marker.
  const key = (e) => `${e.lat.toFixed(4)},${e.lon.toFixed(4)}`;
  const groups = new Map();
  for (const e of visible) {
    const k = key(e);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(e);
  }

  cluster.clearLayers();
  for (const list of groups.values()) {
    const first = list[0];
    const n = list.length;
    const radius = 6 + Math.min(20, Math.sqrt(n) * 3);
    const marker = L.circleMarker([first.lat, first.lon], {
      radius,
      color: '#ff3030',
      weight: 1,
      fillColor: '#ff5050',
      fillOpacity: 0.55,
    });
    const lines = list.map(e =>
      `<div>${fmt(e.t)}${e.comment ? ' &mdash; ' + e.comment.replace(/</g,'&lt;') : ''}</div>`
    );
    marker.bindPopup(
      `<b>${n} event${n>1?'s':''}</b><br>` +
      `MGRS: ${first.mgrs}<br>` +
      `${first.lat.toFixed(5)}, ${first.lon.toFixed(5)}<hr style="margin:4px 0">` +
      lines.join('')
    );
    cluster.addLayer(marker);
  }

  countLabel.textContent = visible.length;
  const winLbl = (half * 2 / 3600).toFixed(half * 2 % 3600 === 0 ? 0 : 1);
  currentLabel.textContent = `${fmt(center)}  (window: ${winLbl}h)`;
}

slider.addEventListener('input', update);
windowSel.addEventListener('change', update);

let playing = false;
let timer = null;
playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.innerHTML = playing ? '&#10074;&#10074; Pause' : '&#9658; Play';
  if (playing) {
    timer = setInterval(() => {
      const step = parseInt(speedSel.value, 10) / 10; // 10 fps
      let v = parseInt(slider.value, 10) + step;
      if (v > tMax) { v = tMin; }
      slider.value = v;
      update();
    }, 100);
  } else {
    clearInterval(timer);
  }
});

update();
</script>
